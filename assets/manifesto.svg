<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220" role="img" aria-labelledby="title">
  <title id="title">No black boxes — understand first, then build</title>
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#c7ff3d"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient>
  </defs>
  <rect width="1400" height="220" rx="22" fill="#08090c"/>
  <rect x="1" y="1" width="1398" height="218" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  <rect x="0" y="0" width="1400" height="4" rx="2" fill="url(#line)"/>
  <text x="54" y="83" fill="#f5f6f8" font-family="Arial Black,Arial,sans-serif" font-size="53" font-weight="900" letter-spacing="-1">NO BLACK BOXES.</text>
  <text x="56" y="133" fill="#a3a9b5" font-family="Arial,sans-serif" font-size="25">If I can't explain it, I keep digging.</text>
  <text x="56" y="177" fill="#c7ff3d" font-family="Consolas,monospace" font-size="18" letter-spacing="2">UNDERSTAND → BUILD → MEASURE → ITERATE</text>
