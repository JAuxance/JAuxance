<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc">
  <title id="title">Auxance — Build to understand</title>
  <desc id="desc">Dark neon profile banner: software engineering, machine learning, France to China.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.55" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7ff3d"/>
      <stop offset="1" stop-color="#57f2c3"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b7ff2e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b7ff2e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1400" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1190" cy="70" r="300" fill="url(#glow)"/>
  <circle cx="1250" cy="40" r="86" fill="#ff3d9a" opacity=".10" filter="url(#blur)"/>
  <path d="M1050 -30L890 430M1160 -30L1000 430M1270 -30L1110 430" stroke="#c7ff3d" stroke-opacity=".09" stroke-width="2"/>
  <rect x="54" y="50" width="8" height="215" rx="4" fill="url(#acid)"/>
  <text x="88" y="75" fill="#c7ff3d" font-family="Consolas,monospace" font-size="18" letter-spacing="5">SOFTWARE × AI × CURIOSITY</text>
  <text x="82" y="190" fill="#f4f5f7" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="112" letter-spacing="-5">AUXANCE</text>
  <text x="88" y="245" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="29" font-weight="700">I BUILD TO <tspan fill="#c7ff3d">UNDERSTAND.</tspan></text>
  <text x="88" y="305" fill="#969cab" font-family="Consolas,monospace" font-size="19">From low-level systems to machine learning.</text>
  <g transform="translate(1040 112)">
    <rect width="270" height="156" rx="18" fill="#080a0d" stroke="#ffffff" stroke-opacity=".13"/>
    <circle cx="24" cy="25" r="4" fill="#ff3d9a"/>
    <circle cx="39" cy="25" r="4" fill="#ffd166"/>
    <circle cx="54" cy="25" r="4" fill="#c7ff3d"/>
    <text x="24" y="66" fill="#737b8d" font-family="Consolas,monospace" font-size="15">$ cat philosophy.txt</text>
    <text x="24" y="99" fill="#f4f5f7" font-family="Consolas,monospace" font-size="17">no_black_boxes = true</text>
    <rect x="24" y="117" width="11" height="20" fill="#c7ff3d"/>
  </g>
  <text x="88" y="355" fill="#666e7d" font-family="Consolas,monospace" font-size="15" letter-spacing="2">FRANCE</text>
  <path d="M172 350H278" stroke="#c7ff3d" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M270 344l10 6-10 6" fill="none" stroke="#c7ff3d" stroke-width="2"/>
  <text x="300" y="355" fill="#666e7d" font-family="Consolas,monospace" font-size="15" letter-spacing="2">CHINA · ML RESEARCH</text>
  <text x="1310" y="355" text-anchor="end" fill="#666e7d" font-family="Consolas,monospace" font-size="15">EST. 2025 / STILL BUILDING</text>
</svg>
